<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能人脸签到系统 - v1.0.4</title>
    <!-- 1. 引入库 -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #ff4757; --accent: #6f42c1; --warning: #f1c40f; }
        body { margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; font-family: 'Segoe UI', system-ui; background: #121212; color: #eee; }
        
        /* 展示区 */
        #display-wrapper { position: relative; width: 100%; max-width: 550px; border-radius: 24px; overflow: hidden; border: 4px solid #333; background: #000; box-shadow: 0 15px 50px rgba(0,0,0,0.6); margin-bottom: 20px; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #static-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: none; justify-content: center; align-items: center; z-index: 5; }
        #static-overlay img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* 录入框 */
        #naming-box { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.95); padding: 20px; border-radius: 20px; border: 2px solid var(--warning); display: none; z-index: 100; width: 85%; max-width: 350px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        #naming-box input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #444; margin-bottom: 15px; font-size: 16px; text-align: center; background: #222; color: white; }
        .naming-btns { display: flex; flex-wrap: wrap; gap: 8px; }
        .naming-btns button { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }

        .container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 1100px; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); padding: 20px; border-radius: 24px; width: 340px; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        
        .admin-wrap { position: absolute; top: 15px; right: 20px; z-index: 100; }
        .lock-btn { cursor: pointer; font-size: 20px; opacity: 0.5; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 8px; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-reg { background: var(--accent); }
        .btn-checkin { background: var(--success); }
        .btn-fix { background: var(--warning); color: #000 !important; }
        .btn-outline { background: transparent; border: 1px solid #555; color: #ccc; }
        .btn-admin { display: none; } 

        .input-group { background: white; border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; min-height: 40px; align-items: center;}
        #name-input { border: none; outline: none; flex: 1; min-width: 60px; font-size: 14px; color: #333; background: transparent; }
        .tag { background: var(--primary); color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; }
        
        .log-item { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .del-btn { color: var(--danger); cursor: pointer; font-size: 20px; font-weight: bold; margin-left: 10px; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 20000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; display: none; justify-content: center; align-items: center; }
        .modal { background: #1e1e1e; padding: 25px; border-radius: 24px; width: 90%; max-width: 420px; }
        .modal input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid #333; background: #222; color: white; box-sizing: border-box; }
        .list-container { max-height: 300px; overflow-y: auto; border: 1px solid #333; border-radius: 10px; margin: 10px 0; }
        .list-item { padding: 12px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .version-tag { position: fixed; bottom: 10px; left: 20px; font-size: 10px; color: rgba(255,255,255,0.2); z-index: 100; pointer-events: none; }
    </style>
</head>
<body>

<div id="loader"><div style="font-size: 24px;">🤖 AI 大脑正在同步档案...</div></div>
<div class="version-tag">Version 1.0.4</div>

<input type="file" id="face-import-input" accept=".json" style="display:none">
<input type="file" id="image-upload-input" accept="image/*" style="display:none">

<div id="display-wrapper">
    <video id="video" autoplay muted playsinline></video>
    <div id="static-overlay"><img id="processed-img" src=""></div>
    <canvas id="overlay-canvas"></canvas>

    <div id="naming-box">
        <div id="naming-info" style="color:var(--warning); font-size:14px; font-weight:bold; margin-bottom:10px;">正在处理人脸</div>
        <input type="text" id="custom-name-input" placeholder="输入姓名保存...">
        <div style="display:flex; gap:10px;">
            <button onclick="confirmNaming()" style="flex:1; padding:10px; background:var(--success); border:none; border-radius:8px; color:white; font-weight:bold; cursor:pointer;">确认保存</button>
            <button onclick="cancelNaming()" style="flex:1; padding:10px; background:#444; border:none; border-radius:8px; color:white; cursor:pointer;">取消</button>
        </div>
    </div>
</div>

<div class="container">
    <div class="card">
        <h3>📸 档案中心</h3>
        <button class="btn btn-reg" onclick="registerFace()">📸 实时捕获录入</button>
        <button class="btn btn-fix btn-admin" onclick="fixRecognition()">🔧 纠正当前识别</button>
        <button class="btn btn-outline" onclick="document.getElementById('image-upload-input').click()">🖼️ 合照批量导入</button>
        <button class="btn btn-admin btn-outline" style="border-color:var(--primary); color:var(--primary);" onclick="openProfileManager()">👥 管理已录入人员</button>
        
        <div class="btn-admin" style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; gap:5px;">
            <button class="btn btn-outline" style="flex:1; font-size:11px;" onclick="exportFaceProfiles()">📤 导出</button>
            <button class="btn btn-outline" style="flex:1; font-size:11px;" onclick="document.getElementById('face-import-input').click()">📥 导入</button>
        </div>
    </div>

    <div class="card">
        <div class="admin-wrap">
            <span id="logout-btn" style="font-size:11px; color:var(--danger); display:none; cursor:pointer; margin-right:10px;" onclick="performLogout()">退出</span>
            <span class="lock-btn" id="lock-icon" onclick="openLoginModal()">🔒</span>
        </div>
        <h3>✅ 签到登记</h3>
        <button class="btn btn-checkin" id="submit-btn" onclick="submitManualCheckIn()">确认提交签到 (0人)</button>
        <div class="input-group">
            <div id="tag-container" style="display:contents"></div>
            <input type="text" id="name-input" placeholder="输入姓名或识别..." autocomplete="off">
        </div>
        <button class="btn btn-admin" style="background:var(--primary); font-size:11px;" onclick="exportAttendanceCSV()">📊 导出今日报表</button>
    </div>

    <div class="card">
        <h3>📜 今日已到</h3>
        <div style="font-size:12px; color:#888; display:flex; justify-content:space-between; margin-bottom:10px;">
            <span id="today-date"></span>
            <span id="today-count">共 0 人</span>
        </div>
        <div id="history-list" style="max-height: 250px; overflow-y: auto;"></div>
    </div>
</div>

<div class="modal-overlay" id="login-modal"><div class="modal"><h3>管理员登录</h3><input type="text" id="admin-user" placeholder="用户名"><input type="password" id="admin-pass" placeholder="密码"><button class="btn btn-primary" onclick="performLogin()">登录</button><button class="btn" style="background:none;" onclick="closeModal('login-modal')">取消</button></div></div>

<!-- 管理档案弹窗：新增搜索框 -->
<div class="modal-overlay" id="profile-modal">
    <div class="modal">
        <h3 style="margin-top:0">档案管理 (共 <span id="profile-count-display">0</span> 人)</h3>
        <!-- 新增：快速搜索框 -->
        <input type="text" id="profile-search-input" placeholder="🔍 输入姓名快速搜索..." style="border: 1px solid var(--primary); outline: none;" oninput="filterProfileList()">
        <div id="profile-list-content" class="list-container"></div>
        <button class="btn btn-checkin" onclick="closeModal('profile-modal')">关闭窗口</button>
    </div>
</div>

<script>
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
    let isAdmin = false, faceMatcher = null, isFrozen = false;
    let batchDetections = [], batchIndex = 0, currentWorkDescriptor = null;

    let state = {
        names: JSON.parse(localStorage.getItem('ai_names') || '[]'),
        history: JSON.parse(localStorage.getItem('ai_history') || '[]'),
        faces: JSON.parse(localStorage.getItem('ai_face_data') || '[]'),
        selected: new Set()
    };

    async function init() {
        try {
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
            await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
            await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            document.getElementById('video').srcObject = stream;
            document.getElementById('video').onloadedmetadata = () => {
                document.getElementById('video').play();
                document.getElementById('loader').style.display = 'none';
                updateFaceMatcher();
                startLiveRecognition();
            };
        } catch (e) { alert("AI核心启动失败"); }
        renderHistory();
    }

    // --- 档案管理：搜索过滤功能 ---
    function openProfileManager() {
        if(!isAdmin) return openLoginModal();
        document.getElementById('profile-search-input').value = ""; // 每次打开清空搜索
        filterProfileList(); // 初始渲染完整列表
        document.getElementById('profile-modal').style.display = 'flex';
    }

    function filterProfileList() {
        const searchTerm = document.getElementById('profile-search-input').value.toLowerCase();
        const cont = document.getElementById('profile-list-content');
        const countDisplay = document.getElementById('profile-count-display');
        
        // 获取所有唯一名单并进行过滤
        const uniqueNames = [...new Set(state.faces.map(f => f.name))];
        const filteredNames = uniqueNames.filter(name => name.toLowerCase().includes(searchTerm));
        
        countDisplay.innerText = filteredNames.length;

        cont.innerHTML = filteredNames.map(name => `
            <div class="list-item">
                <span>👤 <b>${name}</b></span>
                <button onclick="deleteProfile('${name}')" style="color:var(--danger); background:none; border:none; cursor:pointer; font-weight:bold;">删除</button>
            </div>`).join('') || '<p style="text-align:center; padding:20px; color:#666;">未找到匹配人员</p>';
    }

    function deleteProfile(n) {
        if(confirm(`确定删除 ${n} 的识别数据？`)) {
            state.faces = state.faces.filter(f => f.name.toLowerCase() !== n.toLowerCase());
            saveData(); updateFaceMatcher(); filterProfileList(); // 刷新过滤后的列表
        }
    }

    // --- 视觉算法与识别循环 ---
    function startLiveRecognition() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlay-canvas');
        const size = { width: video.offsetWidth, height: video.offsetHeight };
        faceapi.matchDimensions(canvas, size);

        setInterval(async () => {
            if (isFrozen) return;
            const dets = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptors();
            const resized = faceapi.resizeResults(dets, size);
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            resized.forEach(det => {
                let name = "未知人员", color = "#ff4757", isSigned = false;
                if (faceMatcher) {
                    const match = faceMatcher.findBestMatch(det.descriptor);
                    if (match.label !== 'unknown') {
                        name = match.label;
                        isSigned = state.history.some(h => h.name.toLowerCase() === name.toLowerCase() && h.date === new Date().toLocaleDateString('zh-CN'));
                        color = isSigned ? "#2ed573" : "#007bff";
                        if (!isSigned) autoCheckIn(name);
                    }
                }
                const { x, y, width, height } = det.detection.box;
                const headShift = height * 0.25, headHeight = height * 1.3, mx = size.width - x - width;
                ctx.strokeStyle = color; ctx.lineWidth = 5;
                ctx.strokeRect(mx, y - headShift, width, headHeight);
                ctx.fillStyle = color; const bh = isSigned ? 42 : 28;
                ctx.fillRect(mx, y - headShift - bh, width, bh);
                ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.font = "bold 15px Arial";
                const cx = mx + width/2;
                if (isSigned) {
                    ctx.fillText(name, cx, y - headShift - 24); ctx.font = "11px Arial"; ctx.fillText("(已签到)", cx, y - headShift - 8);
                } else { ctx.fillText(name, cx, y - headShift - 9); }
            });
        }, 400);
    }

    // --- 后续常规业务逻辑 (保持不变) ---
    function submitManualCheckIn() {
        const input = document.getElementById('name-input');
        if (input.value.trim()) state.selected.add(input.value.trim());
        if (state.selected.size === 0) return alert("请先选人");
        const today = new Date().toLocaleDateString('zh-CN');
        const signedTodayLower = state.history.filter(h => h.date === today).map(h => h.name.toLowerCase());
        let added = false, dups = [];
        state.selected.forEach(n => {
            if (signedTodayLower.includes(n.toLowerCase())) dups.push(n);
            else {
                state.history.unshift({ name: n, date: today, time: new Date().toLocaleTimeString().substring(0,5), mood: "😊" });
                if (!state.names.some(old => old.toLowerCase() === n.toLowerCase())) state.names.push(n);
                added = true;
            }
        });
        if (dups.length > 0) alert(`⚠️ 重复签到`);
        if (added) { saveData(); renderHistory(); confetti({ particleCount: 100 }); }
        state.selected.clear(); input.value = ''; refreshTags();
    }
    function performLogin() { if(document.getElementById('admin-user').value==="admin" && document.getElementById('admin-pass').value==="8181") { isAdmin=true; document.getElementById('lock-icon').innerHTML="🔓"; document.querySelectorAll('.btn-admin').forEach(e=>e.style.display="flex"); closeModal('login-modal'); renderHistory(); } }
    function performLogout() { isAdmin=false; document.getElementById('lock-icon').innerHTML="🔒"; document.getElementById('logout-btn').style.display="none"; document.querySelectorAll('.btn-admin').forEach(e=>e.style.display="none"); renderHistory(); }
    function saveData() { localStorage.setItem('ai_names', JSON.stringify(state.names)); localStorage.setItem('ai_history', JSON.stringify(state.history)); localStorage.setItem('ai_face_data', JSON.stringify(state.faces)); }
    function renderHistory() { const today = new Date().toLocaleDateString('zh-CN'); const data = state.history.map((h, i) => ({...h, originalIdx: i})).filter(h => h.date === today); document.getElementById('history-list').innerHTML = data.map(h => `<div class="log-item"><span><b>${h.name}</b></span><div><small>${h.time}</small> ${isAdmin ? `<span onclick="deleteLog(${h.originalIdx})" style="color:red; cursor:pointer; margin-left:10px;">×</span>` : ''}</div></div>`).join(''); document.getElementById('today-count').innerText = `共 ${data.length} 人`; document.getElementById('today-date').innerText = today; }
    function deleteLog(i) { state.history.splice(i,1); saveData(); renderHistory(); }
    function refreshTags() { document.getElementById('tag-container').innerHTML = Array.from(state.selected).map(n => `<div class="tag">${n} <span onclick="state.selected.delete('${n}');refreshTags();" style="cursor:pointer;margin-left:5px">×</span></div>`).join(''); document.getElementById('submit-btn').innerText = `确认提交签到 (${state.selected.size}人)`; }
    function updateFaceMatcher() { if (!state.faces.length) return faceMatcher = null; const labeled = state.faces.map(f => new faceapi.LabeledFaceDescriptors(f.name, [new Float32Array(f.descriptor)])); faceMatcher = new faceapi.FaceMatcher(labeled, 0.4); }
    function autoCheckIn(n) { state.history.unshift({ name:n, date: new Date().toLocaleDateString('zh-CN'), time: new Date().toLocaleTimeString().substring(0,5), mood: "🤖" }); saveData(); renderHistory(); }
    function exportFaceProfiles() { const b = new Blob([JSON.stringify(state)], {type:'application/json'}); const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`Face_Backup_v104.json`; a.click(); }
    function exportAttendanceCSV() { const groups = {}; state.history.forEach(h => { if(!groups[h.date]) groups[h.date]=[]; groups[h.date].push(h.name); }); let csv = "\ufeff日期,人数,名单\n"; Object.keys(groups).sort((a,b)=>new Date(b)-new Date(a)).forEach(d => { csv += `${d},${groups[d].length}人,"${groups[d].join('; ')}"\n`; }); const b = new Blob([csv], {type:'text/csv'}); const a = document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`Report.csv`; a.click(); }
    function closeModal(id) { document.getElementById(id).style.display='none'; }
    function openLoginModal() { document.getElementById('login-modal').style.display='flex'; }
    function cancelNaming() { isFrozen=false; currentWorkDescriptor=null; document.getElementById('naming-box').style.display='none'; document.getElementById('static-overlay').style.display='none'; document.getElementById('overlay-canvas').getContext('2d').clearRect(0,0,2000,2000); }
    async function registerFace() { const video = document.getElementById('video'); const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor(); if (det) { const name = prompt("姓名:"); if (name) { state.faces.push({ name, descriptor: Array.from(det.descriptor) }); saveData(); updateFaceMatcher(); alert("录入成功"); } } }
    async function fixRecognition() { if(!isAdmin) return openLoginModal(); const video = document.getElementById('video'); const det = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor(); if (!det) return alert("未见脸部"); isFrozen = true; currentWorkDescriptor = Array.from(det.descriptor); document.getElementById('naming-info').innerText = "🔧 纠正当前识别"; document.getElementById('naming-box').style.display = 'block'; }
    function confirmNaming() { const name = document.getElementById('custom-name-input').value.trim(); if (name) { state.faces = state.faces.filter(f => f.name.toLowerCase() !== name.toLowerCase()); state.faces.push({ name, descriptor: currentWorkDescriptor }); saveData(); updateFaceMatcher(); } cancelNaming(); }

    document.getElementById('face-import-input').onchange = function(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function(ev) {
            try {
                const imported = JSON.parse(ev.target.result);
                state.names = imported.names || []; state.faces = imported.faces || imported.faceData || []; state.history = imported.history || [];
                saveData(); updateFaceMatcher(); alert("导入成功！"); location.reload();
            } catch (err) { alert("格式错误！"); }
        };
        reader.readAsText(file);
    };

    window.onload = init;
</script>
</body>
</html>
